services:
    database:
      image: postgres:18-alpine
      container_name: home-system-postgres

      environment:
        POSTGRES_DB: homesystem
        POSTGRES_USER: homesystem
        POSTGRES_PASSWORD: homesystem

      ports:
        - "5432:5432"

      volumes:
        - home_system_data:/var/lib/postgresql

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 5s
        timeout: 5s
        retries: 10

      restart: unless-stopped

volumes:
  home_system_data: