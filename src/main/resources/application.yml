spring:
    application:
        name: home-system
    
    datasource:
        url: jdbc:postgresql://localhost:5432/homesystem
        username: homesystem
        password: homesystem

    jpa:
        hibernate:
            ddl-auto: validate

    security:
        user:
            name: admin
            password: admin 

    servlet:
        multipart:
            enabled: true
            max-file-size: 2GB
            max-request-size: 2100MB
            file-size-threshold: 0B
        
app:
    admin:
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}
    storage:
        root: ${STORAGE_ROOT:./storage}

server:
    servlet:
        session:
            timeout: 30m
            cookie:
                http-only: true
                same-site: lax

logging:
    level:
        org.springframework.security: TRACE
        org.springframework.web: DEBUG